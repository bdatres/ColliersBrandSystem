<!doctype html>
<!-- @dsCard group="Brand" name="Tint scale" subtitle="80/60/40/20/10 across the system" viewport="700x280" -->
<html><head><meta charset="utf-8"><title>Tints</title>
<link rel="stylesheet" href="_card.css">
<style>
  .tints { display: grid; grid-template-columns: 110px repeat(5, 1fr); gap: 8px; align-items: center; }
  .tint-label { font-size: 11px; font-weight: 700; color: var(--col-deep-blue); }
  .tint-cell { height: 44px; border-radius: 6px; display: flex; align-items: flex-end; justify-content: flex-end; padding: 4px 6px; font-size: 9px; font-family: ui-monospace, monospace; color: var(--col-deep-blue); }
  .pct { display: grid; grid-template-columns: 110px repeat(5, 1fr); gap: 8px; margin-bottom: 8px; }
  .pct .head { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; color: var(--col-dark-blue-grey); text-align: center; }
  .pct .head:first-child { text-align: left; }
</style></head>
<body><div class="card">
  <p class="card-label">Tint scale · 100/80/60/40/20/10</p>
  <div class="pct">
    <span class="head"></span>
    <span class="head">80%</span><span class="head">60%</span><span class="head">40%</span><span class="head">20%</span><span class="head">10%</span>
  </div>
  <div class="tints">
    <span class="tint-label">Dark Blue</span>
    <div class="tint-cell" style="background: rgba(37,64,143,0.8); color:#fff">.8</div>
    <div class="tint-cell" style="background: rgba(37,64,143,0.6); color:#fff">.6</div>
    <div class="tint-cell" style="background: rgba(37,64,143,0.4)">.4</div>
    <div class="tint-cell" style="background: rgba(37,64,143,0.2)">.2</div>
    <div class="tint-cell" style="background: rgba(37,64,143,0.1)">.1</div>
  </div>
  <div class="tints" style="margin-top:8px">
    <span class="tint-label">Medium Blue</span>
    <div class="tint-cell" style="background: rgba(28,84,244,0.8); color:#fff">.8</div>
    <div class="tint-cell" style="background: rgba(28,84,244,0.6); color:#fff">.6</div>
    <div class="tint-cell" style="background: rgba(28,84,244,0.4)">.4</div>
    <div class="tint-cell" style="background: rgba(28,84,244,0.2)">.2</div>
    <div class="tint-cell" style="background: rgba(28,84,244,0.1)">.1</div>
  </div>
  <div class="tints" style="margin-top:8px">
    <span class="tint-label">Deep Blue Grey</span>
    <div class="tint-cell" style="background: rgba(53,62,89,0.8); color:#fff">.8</div>
    <div class="tint-cell" style="background: rgba(53,62,89,0.6); color:#fff">.6</div>
    <div class="tint-cell" style="background: rgba(53,62,89,0.4)">.4</div>
    <div class="tint-cell" style="background: rgba(53,62,89,0.2)">.2</div>
    <div class="tint-cell" style="background: rgba(53,62,89,0.1)">.1</div>
  </div>
  <p class="card-sub">Approved tint stops apply to every palette color for chart series, map regions, and subtle backgrounds.</p>
</div></body></html>
