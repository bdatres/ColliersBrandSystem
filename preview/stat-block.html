<!doctype html>
<!-- @dsCard group="Brand" name="KPI stats" subtitle="Light numerals with bold accent" viewport="700x220" -->
<html><head><meta charset="utf-8"><title>Stat block</title>
<link rel="stylesheet" href="_card.css">
<style>
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .stat { padding: 6px 0; }
  .num { font: 300 44px/1 "Merriweather", Georgia, serif; color: var(--col-deep-blue); letter-spacing: -0.02em; }
  .num b { font-weight: 700; color: var(--col-medium-blue); }
  .lbl { font: 700 10px/1.3 "Open Sans"; text-transform: uppercase; letter-spacing: 0.16em; color: var(--col-dark-blue-grey); margin-top: 8px; }
  .sub { font: 400 12px/1.4 "Open Sans"; color: var(--col-deep-blue-grey); margin-top: 2px; }
</style></head>
<body><div class="card">
  <p class="card-label">KPI / stat block</p>
  <div class="row">
    <div class="stat">
      <div class="num">$<b>4.5</b>B</div>
      <div class="lbl">Annual revenue</div>
      <div class="sub">FY2025</div>
    </div>
    <div class="stat">
      <div class="num"><b>22,000</b>+</div>
      <div class="lbl">Professionals worldwide</div>
      <div class="sub">68 countries</div>
    </div>
    <div class="stat">
      <div class="num"><b>2.0</b>B sf</div>
      <div class="lbl">Under management</div>
      <div class="sub">Across all asset classes</div>
    </div>
  </div>
</div></body></html>
