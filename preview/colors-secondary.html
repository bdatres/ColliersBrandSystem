<!doctype html>
<!-- @dsCard group="Brand" name="Secondary palette" subtitle="Cool blue-greys for text + sectioning" viewport="700x210" -->
<html><head><meta charset="utf-8"><title>Secondary palette</title>
<link rel="stylesheet" href="_card.css">
<style>
  .swatch.s1 { background: #353E59; }
  .swatch.s2 { background: #56648F; }
  .swatch.s3 { background: #7B8BBD; }
  .swatch.s4 { background: #ACBBE8; color: var(--col-deep-blue); }
  .swatch.s5 { background: #DBE5FF; color: var(--col-deep-blue); }
</style></head>
<body><div class="card">
  <p class="card-label">Secondary palette · text + sectioning</p>
  <div class="swatch-row">
    <div class="swatch s1"><span class="name">Deep Blue Grey</span><span class="hex">#353E59</span></div>
    <div class="swatch s2"><span class="name">Dark Blue Grey</span><span class="hex">#56648F</span></div>
    <div class="swatch s3"><span class="name">Medium Blue Grey</span><span class="hex">#7B8BBD</span></div>
    <div class="swatch s4"><span class="name">Light Blue Grey</span><span class="hex">#ACBBE8</span></div>
    <div class="swatch s5"><span class="name">Pale Blue Grey</span><span class="hex">#DBE5FF</span></div>
  </div>
  <p class="card-sub">Used for body text, backgrounds and section breaks. Cannot be used for blocks or keylines.</p>
</div></body></html>
