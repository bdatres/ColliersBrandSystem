<!doctype html>
<!-- @dsCard group="Brand" name="Buttons" subtitle="Primary, secondary, ghost · default/hover/press" viewport="700x240" -->
<html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="_card.css">
<style>
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px 16px; align-items: center; }
  .lbl { font: 700 9px/1 "Open Sans", Verdana; text-transform: uppercase; letter-spacing: 0.16em; color: var(--col-dark-blue-grey); margin-bottom: 6px; }
  .btn {
    font: 700 13px/1 "Open Sans", Verdana;
    padding: 12px 22px;
    border-radius: 4px;
    border: 0;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: background 200ms cubic-bezier(0.2,0,0,1);
  }
  .primary { background: var(--col-medium-blue); color: #fff; }
  .primary.hover { background: var(--col-dark-blue); }
  .primary.press { background: var(--col-deep-blue); }
  .secondary { background: transparent; color: var(--col-dark-blue); border: 1.5px solid var(--col-dark-blue); }
  .secondary.hover { background: rgba(28,84,244,0.08); }
  .ghost { background: transparent; color: var(--col-dark-blue); padding: 12px 8px; }
  .ghost.hover { color: var(--col-medium-blue); }
  .col { display: flex; flex-direction: column; align-items: flex-start; }
</style></head>
<body><div class="card">
  <p class="card-label">Buttons · primary / secondary / ghost</p>
  <div class="grid">
    <div class="col"><div class="lbl">Default</div><button class="btn primary">Get in touch</button></div>
    <div class="col"><div class="lbl">Hover</div><button class="btn primary hover">Get in touch</button></div>
    <div class="col"><div class="lbl">Pressed</div><button class="btn primary press">Get in touch</button></div>
    <div class="col"><div class="lbl">Default</div><button class="btn secondary">View report</button></div>
    <div class="col"><div class="lbl">Hover</div><button class="btn secondary hover">View report</button></div>
    <div class="col"><div class="lbl">Ghost</div><button class="btn ghost hover">Read more →</button></div>
  </div>
</div></body></html>
