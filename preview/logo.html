<!doctype html>
<!-- @dsCard group="Brand" name="Logo" subtitle="Primary mark, clear-space + min-size" viewport="700x220" -->
<html><head><meta charset="utf-8"><title>Logo</title>
<link rel="stylesheet" href="_card.css">
<style>
  .logo-wrap {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 28px;
    align-items: center;
  }
  .logo-tile {
    background: #25408F;
    border-radius: 12px;
    padding: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo-tile img { width: 100%; height: auto; display: block; }
  .specs { font-size: 12px; color: var(--col-deep-blue-grey); line-height: 1.7; }
  .specs b { color: var(--col-deep-blue); font-weight: 700; }
  .specs .row { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid rgba(53,62,89,0.12); }
  .specs .row:last-child { border-bottom: 0; }
  .specs .k { width: 110px; color: var(--col-dark-blue-grey); text-transform: uppercase; letter-spacing: 0.1em; font-size: 10px; font-weight: 700; }
</style></head>
<body><div class="card">
  <div class="logo-wrap">
    <div class="logo-tile"><img src="../assets/colliers-logo.png" alt="Colliers logo"></div>
    <div class="specs">
      <div class="row"><span class="k">Tagline</span><span><b>Accelerating success.</b></span></div>
      <div class="row"><span class="k">Min screen</span><span>80px wide</span></div>
      <div class="row"><span class="k">Min print</span><span>0.5″ / 13mm wide</span></div>
      <div class="row"><span class="k">Clear space</span><span>2× stripe height on all sides</span></div>
      <div class="row"><span class="k">Versions</span><span>Full color · Single color · Black · Wordmark</span></div>
    </div>
  </div>
</div></body></html>
