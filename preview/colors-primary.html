<!doctype html>
<!-- @dsCard group="Brand" name="Primary palette" subtitle="Six brand blues — must dominate" viewport="700x220" -->
<html><head><meta charset="utf-8"><title>Primary palette</title>
<link rel="stylesheet" href="_card.css">
<style>
  .swatch.s1 { background: #000759; }
  .swatch.s2 { background: #25408F; }
  .swatch.s3 { background: #1C54F4; }
  .swatch.s4 { background: #4D93FF; }
  .swatch.s5 { background: #C3E6FF; color: var(--col-deep-blue); }
  .swatch.s6 { background: #FFFFFF; color: var(--col-deep-blue); border-color: rgba(53,62,89,0.18); }
</style></head>
<body><div class="card">
  <p class="card-label">Primary palette · blue dominates</p>
  <div class="swatch-row">
    <div class="swatch s1"><span class="name">Deep Blue</span><span class="hex">#000759</span></div>
    <div class="swatch s2"><span class="name">Dark Blue</span><span class="hex">#25408F</span></div>
    <div class="swatch s3"><span class="name">Medium Blue</span><span class="hex">#1C54F4</span></div>
    <div class="swatch s4"><span class="name">Light Blue</span><span class="hex">#4D93FF</span></div>
    <div class="swatch s5"><span class="name">Pale Blue</span><span class="hex">#C3E6FF</span></div>
    <div class="swatch s6"><span class="name">White</span><span class="hex">#FFFFFF</span></div>
  </div>
  <p class="card-sub">Deep, Dark and Medium Blue must dominate every design. Medium / Light Blue are digital-first — they shift in print.</p>
</div></body></html>
