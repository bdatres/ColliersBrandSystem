<!doctype html>
<!-- @dsCard group="Brand" name="Cards" subtitle="Property + report card, resting + hover" viewport="700x240" -->
<html><head><meta charset="utf-8"><title>Cards</title>
<link rel="stylesheet" href="_card.css">
<style>
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .pcard {
    background: #fff;
    border-radius: 12px;
    border: 1px solid rgba(53,62,89,0.12);
    box-shadow: 0 1px 2px rgba(0,7,89,.06);
    overflow: hidden;
  }
  .img { background: linear-gradient(135deg, #25408F, #1C54F4); height: 120px; position: relative; }
  .img::after { content: ""; position: absolute; left: 14px; bottom: 14px; width: 38px; height: 4px; background: #FFD400; border-radius: 1px; }
  .body { padding: 14px 16px; }
  .eyebrow { font: 700 9px/1 "Open Sans"; text-transform: uppercase; letter-spacing: 0.18em; color: var(--col-dark-blue); margin-bottom: 6px; }
  .ttl { font: 600 16px/1.25 "Open Sans"; color: var(--col-deep-blue); margin: 0 0 4px; }
  .meta { font: 400 12px/1.4 "Open Sans"; color: var(--col-dark-blue-grey); }
  .pcard.hovered { box-shadow: 0 4px 12px rgba(0,7,89,.08), 0 1px 2px rgba(0,7,89,.04); transform: translateY(-1px); }
</style></head>
<body><div class="card">
  <p class="card-label">Card · resting and hovered</p>
  <div class="grid">
    <div class="pcard">
      <div class="img"></div>
      <div class="body">
        <div class="eyebrow">FOR LEASE · OFFICE</div>
        <div class="ttl">100 Bishopsgate</div>
        <div class="meta">London EC2N · 18,420 sq ft available</div>
      </div>
    </div>
    <div class="pcard hovered">
      <div class="img"></div>
      <div class="body">
        <div class="eyebrow">MARKET REPORT</div>
        <div class="ttl">Q4 Industrial Outlook</div>
        <div class="meta">Sun Belt vacancy tightens for the third quarter.</div>
      </div>
    </div>
  </div>
</div></body></html>
