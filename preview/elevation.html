<!doctype html>
<!-- @dsCard group="Brand" name="Elevation" subtitle="Three subtle blue-tinted shadows" viewport="700x200" -->
<html><head><meta charset="utf-8"><title>Elevation</title>
<link rel="stylesheet" href="_card.css">
<style>
  .row { display: flex; gap: 18px; padding: 14px 0 18px; }
  .item { flex: 1; }
  .box {
    background: #fff; height: 72px;
    border-radius: 12px;
    border: 1px solid rgba(53,62,89,0.06);
  }
  .e1 { box-shadow: 0 1px 2px rgba(0,7,89,.06), 0 1px 1px rgba(0,7,89,.04); }
  .e2 { box-shadow: 0 4px 12px rgba(0,7,89,.08), 0 1px 2px rgba(0,7,89,.04); }
  .e3 { box-shadow: 0 12px 28px rgba(0,7,89,.12), 0 2px 6px rgba(0,7,89,.06); }
  .lbl { font: 700 11px/1 "Open Sans", Verdana; color: var(--col-deep-blue); margin-top: 12px; }
  .v { font-family: ui-monospace, monospace; font-size: 10px; color: var(--col-dark-blue-grey); margin-top: 4px; }
</style></head>
<body><div class="card">
  <p class="card-label">Elevation · subtle, blue-tinted shadows</p>
  <div class="row">
    <div class="item"><div class="box e1"></div><div class="lbl">shadow-1</div><div class="v">resting card</div></div>
    <div class="item"><div class="box e2"></div><div class="lbl">shadow-2</div><div class="v">hovered / popover</div></div>
    <div class="item"><div class="box e3"></div><div class="lbl">shadow-3</div><div class="v">modal / overlay</div></div>
  </div>
</div></body></html>
