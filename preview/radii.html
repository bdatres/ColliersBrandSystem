<!doctype html>
<!-- @dsCard group="Brand" name="Corner radii" subtitle="xs → pill · 20px echoes the logo" viewport="700x200" -->
<html><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="_card.css">
<style>
  .row { display: flex; gap: 16px; align-items: flex-end; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 1; }
  .box { background: var(--col-medium-blue); width: 100%; height: 80px; }
  .lbl { font: 700 11px/1 "Open Sans", Verdana; color: var(--col-deep-blue); }
  .v { font-family: ui-monospace, monospace; font-size: 10px; color: var(--col-dark-blue-grey); }
</style></head>
<body><div class="card">
  <p class="card-label">Corner radii · echoes the logo's rounded rectangle</p>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:2px"></div><span class="lbl">xs</span><span class="v">2 px</span></div>
    <div class="item"><div class="box" style="border-radius:4px"></div><span class="lbl">sm</span><span class="v">4 px</span></div>
    <div class="item"><div class="box" style="border-radius:8px"></div><span class="lbl">md</span><span class="v">8 px</span></div>
    <div class="item"><div class="box" style="border-radius:12px"></div><span class="lbl">lg</span><span class="v">12 px</span></div>
    <div class="item"><div class="box" style="border-radius:20px"></div><span class="lbl">xl</span><span class="v">20 px · logo</span></div>
    <div class="item"><div class="box" style="border-radius:999px"></div><span class="lbl">pill</span><span class="v">999 px</span></div>
  </div>
</div></body></html>
