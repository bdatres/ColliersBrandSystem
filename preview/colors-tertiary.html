<!doctype html>
<!-- @dsCard group="Brand" name="Tertiary palette" subtitle="Charts + illustration only · ≤25%" viewport="700x290" -->
<html><head><meta charset="utf-8"><title>Tertiary palette</title>
<link rel="stylesheet" href="_card.css">
<style>
  .row2 { display: flex; gap: 10px; margin-top: 10px; }
  .swatch.s1 { background: #ED1B34; }
  .swatch.s2 { background: #FFD400; color: var(--col-deep-blue); }
  .swatch.s3 { background: #0C9ED9; }
  .swatch.s4 { background: #FA6609; }
  .swatch.s5 { background: #9C45AE; }
  .swatch.s6 { background: #2AB6A9; }
  .swatch.s7 { background: #CCCDD5; color: var(--col-deep-blue); }
</style></head>
<body><div class="card">
  <p class="card-label">Tertiary palette · charts &amp; illustration only</p>
  <div class="swatch-row">
    <div class="swatch s1"><span class="name">Red</span><span class="hex">#ED1B34</span></div>
    <div class="swatch s2"><span class="name">Yellow</span><span class="hex">#FFD400</span></div>
    <div class="swatch s3"><span class="name">Light Blue</span><span class="hex">#0C9ED9</span></div>
    <div class="swatch s4"><span class="name">Orange</span><span class="hex">#FA6609</span></div>
  </div>
  <div class="row2">
    <div class="swatch s5"><span class="name">Purple</span><span class="hex">#9C45AE</span></div>
    <div class="swatch s6"><span class="name">Teal</span><span class="hex">#2AB6A9</span></div>
    <div class="swatch s7"><span class="name">Cool Grey</span><span class="hex">#CCCDD5</span></div>
  </div>
  <p class="card-sub">Use sparingly — never for text, keyline or blocks. Capped at 25% of any composition. Red implies negative trend.</p>
</div></body></html>
