<!doctype html>
<!-- @dsCard group="Brand" name="Form inputs" subtitle="Default, focus, error" viewport="700x320" -->
<html><head><meta charset="utf-8"><title>Form inputs</title>
<link rel="stylesheet" href="_card.css">
<style>
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 18px; }
  label { display: flex; flex-direction: column; gap: 6px; font: 600 12px/1 "Open Sans", Verdana; color: var(--col-deep-blue); letter-spacing: 0.02em; }
  input, select {
    font: 400 14px/1 "Open Sans", Verdana;
    color: var(--col-deep-blue);
    padding: 10px 12px;
    border: 1px solid rgba(53,62,89,0.32);
    border-radius: 4px;
    background: #fff;
    outline: none;
  }
  input:focus, select:focus { border-color: var(--col-medium-blue); box-shadow: 0 0 0 3px rgba(28,84,244,0.18); }
  input::placeholder { color: var(--col-mid-blue-grey); }
  .focused { border-color: var(--col-medium-blue) !important; box-shadow: 0 0 0 3px rgba(28,84,244,0.18); }
  .err { border-color: #ED1B34 !important; }
  .errmsg { font: 400 11px/1.4 "Open Sans"; color: #ED1B34; margin-top: 2px; }
</style></head>
<body><div class="card">
  <p class="card-label">Form fields · default · focus · error</p>
  <div class="grid">
    <label>First name<input type="text" value="Sara"></label>
    <label>Email<input type="email" placeholder="you@firm.com" class="focused"></label>
    <label>Company<input type="text" placeholder="Optional"></label>
    <label>Property type
      <select><option>Office</option><option>Industrial</option></select>
    </label>
    <label style="grid-column: 1 / -1">Postcode
      <input type="text" value="SW1 9XX" class="err">
      <span class="errmsg">Please enter a valid UK postcode.</span>
    </label>
  </div>
</div></body></html>
