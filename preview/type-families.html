<!doctype html>
<!-- @dsCard group="Brand" name="Type families" subtitle="Open Sans + Merriweather" viewport="700x220" -->
<html><head><meta charset="utf-8"><title>Type families</title>
<link rel="stylesheet" href="_card.css">
<style>
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .col { padding: 18px; border-radius: 10px; border: 1px solid rgba(53,62,89,0.14); }
  .name { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.18em; color: var(--col-dark-blue); margin-bottom: 8px; }
  .specimen-sans { font-family: "Open Sans", Verdana, sans-serif; font-size: 44px; font-weight: 300; color: var(--col-deep-blue); line-height: 1.05; letter-spacing: -0.01em; }
  .specimen-serif { font-family: "Merriweather", Georgia, serif; font-size: 36px; font-weight: 300; color: var(--col-deep-blue); line-height: 1.15; letter-spacing: -0.01em; }
  .meta { font-size: 11px; color: var(--col-dark-blue-grey); margin-top: 10px; line-height: 1.5; }
</style></head>
<body><div class="card">
  <div class="pair">
    <div class="col">
      <div class="name">Primary · Open Sans</div>
      <div class="specimen-sans">Aa Bb Gg</div>
      <div class="meta">300 / 400 / 600 / 700<br>Workhorse for headlines, body, UI. Verdana fallback.</div>
    </div>
    <div class="col">
      <div class="name">Secondary · Merriweather</div>
      <div class="specimen-serif">Aa Bb Gg</div>
      <div class="meta">300 / 400 / 700<br>Pull quotes, long-form subheads. Georgia fallback.</div>
    </div>
  </div>
</div></body></html>
