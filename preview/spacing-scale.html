<!doctype html>
<!-- @dsCard group="Brand" name="Spacing scale" subtitle="8pt rhythm tokens" viewport="700x320" -->
<html><head><meta charset="utf-8"><title>Spacing scale</title>
<link rel="stylesheet" href="_card.css">
<style>
  .row { display: grid; grid-template-columns: 70px 1fr 60px; gap: 14px; align-items: center; padding: 4px 0; }
  .tok { font: 700 11px/1 "Open Sans", Verdana; color: var(--col-deep-blue); }
  .bar { height: 14px; background: var(--col-medium-blue); border-radius: 3px; }
  .px { font-family: ui-monospace, monospace; font-size: 11px; color: var(--col-dark-blue-grey); text-align: right; }
</style></head>
<body><div class="card">
  <p class="card-label">Spacing scale · 8pt rhythm</p>
  <div class="row"><span class="tok">space-1</span><div class="bar" style="width: 4px"></div><span class="px">4 px</span></div>
  <div class="row"><span class="tok">space-2</span><div class="bar" style="width: 8px"></div><span class="px">8 px</span></div>
  <div class="row"><span class="tok">space-3</span><div class="bar" style="width: 12px"></div><span class="px">12 px</span></div>
  <div class="row"><span class="tok">space-4</span><div class="bar" style="width: 16px"></div><span class="px">16 px</span></div>
  <div class="row"><span class="tok">space-6</span><div class="bar" style="width: 24px"></div><span class="px">24 px</span></div>
  <div class="row"><span class="tok">space-8</span><div class="bar" style="width: 32px"></div><span class="px">32 px</span></div>
  <div class="row"><span class="tok">space-12</span><div class="bar" style="width: 48px"></div><span class="px">48 px</span></div>
  <div class="row"><span class="tok">space-16</span><div class="bar" style="width: 64px"></div><span class="px">64 px</span></div>
  <div class="row"><span class="tok">space-24</span><div class="bar" style="width: 96px"></div><span class="px">96 px</span></div>
</div></body></html>
